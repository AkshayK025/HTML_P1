<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Makes the page responsive on mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        h1 {
            font-size: 32px;
        }

        p {
            font-size: 18px;
        }

        /* Automatically resize images */
        img {
            width: 100%;
            max-width: 1000px;
            height: auto;
            display: block;
            margin: 20px auto;
        }

        /* Mobile adjustments */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            h1 {
                font-size: 24px;
            }

            p {
                font-size: 16px;
            }

            img {
                margin: 10px auto;
            }
        }
    </style>
</head>

<body>

    <h1>Hello World!</h1>
    <p>My first GitHub website.</p>

    <img src="All Pages-12.jpg.jpeg" alt="Page 12">
    <img src="All Pages-13.jpg.jpeg" alt="Page 13">
    <img src="All Pages-14.jpg.jpeg" alt="Page 14">
    <img src="All Pages-15.jpg.jpeg" alt="Page 15">
    <img src="All Pages-16.jpg.jpeg" alt="Page 16">

</body>
</html>
